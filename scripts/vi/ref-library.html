<title>Pustaka Referensi Tuntun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a timeline rail of collections (a connector with dots, like the videos' mindmaps) beside one column of collections, each a note block over a grid of reference cards. */
:root {
  --bg: #F4F4F7;
  --surface: #FFFFFF;
  --surface-2: #ECECF1;
  --ink: #17161D;
  --muted: #64636E;
  --line: #E1E0E8;
  --accent: #5F4DEE;
  --accent-ink: #4636C9;
  --cyan: #5CC8E3;
  --stage: #0F0E15;
  --stage-ink: #ECEBF2;
  --on-accent: #FFFFFF;
  --s-berlaku-bg: #ECEAFD; --s-berlaku-fg: #4636C9;
  --s-dipakai-bg: #E0F4F9; --s-dipakai-fg: #1A6A80;
  --s-sebagian-bg: #FBF0DC; --s-sebagian-fg: #855610;
  --s-arsip-bg: #EBEBEF; --s-arsip-fg: #5D5C66;
  --shadow: 0 1px 2px rgba(23, 22, 29, .05), 0 10px 28px rgba(23, 22, 29, .07);
  --backdrop: rgba(14, 13, 20, .8);
  --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111017; --surface: #1A1922; --surface-2: #23222D; --ink: #ECEBF2; --muted: #A09EAE; --line: #2D2C38;
    --accent: #8E82FF; --accent-ink: #B1A8FF; --cyan: #6FD3EA; --stage: #08070C; --stage-ink: #ECEBF2; --on-accent: #111017;
    --s-berlaku-bg: #2A2550; --s-berlaku-fg: #C9C2FF; --s-dipakai-bg: #15333D; --s-dipakai-fg: #93DDEE;
    --s-sebagian-bg: #3A2D15; --s-sebagian-fg: #F0C77A; --s-arsip-bg: #2A2A31; --s-arsip-fg: #B4B3BD;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .4); --backdrop: rgba(0, 0, 0, .86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111017; --surface: #1A1922; --surface-2: #23222D; --ink: #ECEBF2; --muted: #A09EAE; --line: #2D2C38;
  --accent: #8E82FF; --accent-ink: #B1A8FF; --cyan: #6FD3EA; --stage: #08070C; --stage-ink: #ECEBF2; --on-accent: #111017;
  --s-berlaku-bg: #2A2550; --s-berlaku-fg: #C9C2FF; --s-dipakai-bg: #15333D; --s-dipakai-fg: #93DDEE;
  --s-sebagian-bg: #3A2D15; --s-sebagian-fg: #F0C77A; --s-arsip-bg: #2A2A31; --s-arsip-fg: #B4B3BD;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .4); --backdrop: rgba(0, 0, 0, .86);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: .9375rem; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }

.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 96px;
}

/* header */
.top { display: grid; gap: 10px; max-width: 760px; padding-bottom: 28px; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(2rem, 4.2vw, 2.875rem); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
h1 .dot { color: var(--accent); }
.lede { margin: 0; color: var(--muted); font-size: 1rem; max-width: 62ch; }
.counts { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: .8125rem; color: var(--muted); }
.counts b { color: var(--ink); font-weight: 500; }

.layout { display: grid; gap: 40px; grid-template-columns: 1fr; }
@media (min-width: 1040px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } }

/* rail */
.rail { display: none; }
@media (min-width: 1040px) {
  .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; }
}
.rail ol { list-style: none; margin: 0; padding: 4px 0 0; position: relative; display: grid; gap: 4px; }
.rail ol::before {
  content: ""; position: absolute; left: 6px; top: 14px; bottom: 14px; width: 2px; border-radius: 2px;
  background: linear-gradient(var(--accent), var(--cyan));
}
.rail a {
  position: relative; display: grid; gap: 1px; padding: 7px 8px 7px 26px; border-radius: 10px; text-decoration: none; color: var(--ink);
  transition: background-color .2s ease;
}
.rail a::before {
  content: ""; position: absolute; left: 1px; top: 13px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--accent); box-sizing: border-box;
}
.rail a:hover { background: var(--surface-2); }
.rail a.on { background: var(--surface); box-shadow: var(--shadow); }
.rail a.on::before { background: var(--accent); }
.rail a.dim { opacity: .45; }
.rail time { font-family: var(--font-mono); font-size: .6875rem; color: var(--muted); letter-spacing: .02em; }
.rail span { font-size: .8125rem; font-weight: 500; line-height: 1.3; }

/* filters */
.filters {
  background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 12px; margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button, .chip {
  font: inherit; font-size: .8125rem; font-weight: 500; color: var(--muted); background: transparent; border: 0; cursor: pointer;
  padding: 6px 12px; border-radius: 999px; transition: background-color .2s ease, color .2s ease;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg button small, .chip small { font-family: var(--font-mono); font-size: .6875rem; margin-left: 4px; opacity: .75; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--s-berlaku-bg); }
.search { margin-left: auto; position: relative; min-width: 0; flex: 0 1 240px; }
.search input {
  width: 100%; font: inherit; font-size: .875rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 14px;
}
.search input::placeholder { color: var(--muted); }
@media (max-width: 640px) { .search { flex: 1 1 100%; margin-left: 0; } }
@media (min-width: 641px) { .filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; } }

/* collections */
.col { padding-block: 36px 8px; scroll-margin-top: 96px; display: grid; gap: 22px; }
.col + .col { border-top: 1px solid var(--line); }
.col-head { display: grid; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.meta time { font-family: var(--font-mono); font-size: .8125rem; color: var(--muted); }
.pill { font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: .01em; }
.s-berlaku { background: var(--s-berlaku-bg); color: var(--s-berlaku-fg); }
.s-dipakai { background: var(--s-dipakai-bg); color: var(--s-dipakai-fg); }
.s-sebagian { background: var(--s-sebagian-bg); color: var(--s-sebagian-fg); }
.s-arsip { background: var(--s-arsip-bg); color: var(--s-arsip-fg); }
.folder { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
h2 { font-size: clamp(1.25rem, 2.2vw, 1.5rem); font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.quote {
  margin: 0; max-width: 70ch; padding: 12px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px;
  font-size: .9375rem;
}
.quote .who { display: block; font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; }
.kw span { font-family: var(--font-mono); font-size: .75rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent-ink); }
.notes { display: grid; gap: 14px 28px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.notes h3 { font-family: var(--font-mono); font-size: .6875rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.notes ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .875rem; }
.notes li { position: relative; padding-left: 18px; }
.notes li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.notes .x li { color: var(--muted); }
.notes .x li::before { background: none; border-radius: 0; width: 9px; height: 9px; top: .5em; left: 1px;
  background: linear-gradient(45deg, transparent 43%, var(--muted) 43% 57%, transparent 57%), linear-gradient(-45deg, transparent 43%, var(--muted) 43% 57%, transparent 57%); }
.notes .q li::before { background: var(--surface); border: 2px solid var(--s-sebagian-fg); box-sizing: border-box; }
.notes .u li::before { background: var(--cyan); }

/* cards */
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 228px), 1fr)); }
.card { display: grid; grid-template-rows: auto 1fr; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.thumb {
  position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; padding: 0; border: 0; cursor: zoom-in;
  background: var(--surface-2); overflow: hidden; text-decoration: none;
}
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform .5s cubic-bezier(.45, 0, .55, 1); }
.card:hover .thumb img { transform: scale(1.03); }
.thumb video { position: absolute; inset: 0; background: var(--surface-2); }
.badge {
  position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: .6875rem; color: #fff; background: #17161D; padding: 4px 9px 4px 8px; border-radius: 999px;
}
.badge svg { width: 9px; height: 9px; fill: currentColor; }
.ph { display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.ph div { display: grid; justify-items: center; gap: 8px; font-family: var(--font-mono); font-size: .75rem; }
.ph svg { width: 34px; height: 34px; fill: var(--accent); }
.body { padding: 14px 16px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.body h4 { font-size: .9375rem; font-weight: 600; line-height: 1.3; }
.body p { margin: 0; font-size: .8125rem; color: var(--muted); }
.foot { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-family: var(--font-mono); font-size: .6875rem; color: var(--muted); }
.foot a { color: var(--accent-ink); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.tagline { display: flex; flex-wrap: wrap; gap: 4px; }
.tagline span { font-size: .6875rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.empty { padding: 48px 0; color: var(--muted); text-align: center; }

/* viewer */
dialog#box {
  width: min(1240px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 0; border-radius: 18px;
  background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); overflow: hidden;
}
dialog#box::backdrop { background: var(--backdrop); }
.viewer { display: grid; grid-template-columns: 1fr; max-height: calc(100dvh - 24px); }
@media (min-width: 900px) { .viewer { grid-template-columns: minmax(0, 1fr) 320px; } }
.stage { background: var(--stage); display: grid; place-items: center; min-height: 240px; max-height: calc(100dvh - 24px); overflow: auto; }
.stage img, .stage video { display: block; max-width: 100%; max-height: calc(100dvh - 24px); object-fit: contain; }
@media (max-width: 899px) { .stage img, .stage video { max-height: 62dvh; } }
.info { padding: 22px 22px 20px; display: grid; gap: 12px; align-content: start; overflow: auto; border-left: 1px solid var(--line); min-width: 0; }
.info .from { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.info h3 { font-size: 1.25rem; font-weight: 600; line-height: 1.25; }
.info p { margin: 0; color: var(--muted); font-size: .875rem; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .8125rem; }
.info dt { color: var(--muted); font-family: var(--font-mono); font-size: .6875rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.info dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.info dd code { font-family: var(--font-mono); font-size: .75rem; user-select: all; }
.go {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .875rem; color: var(--on-accent); background: var(--accent);
  padding: 9px 16px; border-radius: 999px; text-decoration: none;
}
.vbar { display: flex; gap: 8px; margin-top: 4px; }
.vbar button {
  font: inherit; font-size: .8125rem; font-weight: 500; color: var(--ink); background: var(--surface-2); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.vbar .close { margin-left: auto; }
.vbar small { font-family: var(--font-mono); color: var(--muted); align-self: center; font-size: .75rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">Tuntun Academy · gaya video</p>
    <h1>Pustaka Referensi<span class="dot">.</span></h1>
    <p class="lede">Semua referensi gaya yang kamu kirim, di satu tempat, yang terbaru di atas. Tiap koleksi mencatat apa yang diambil, apa yang dibuang, dan di video mana sudah dipakai.</p>
    <p class="counts" id="counts"></p>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="Koleksi"><ol id="rail"></ol></nav>
    <main>
      <div class="filters">
        <div class="seg" id="types" role="group" aria-label="Jenis"></div>
        <div class="tags" id="tags" role="group" aria-label="Topik"></div>
        <label class="search"><span hidden>Cari</span><input id="q" type="search" placeholder="Cari referensi…" autocomplete="off"></label>
      </div>
      <div id="sections"></div>
      <p class="empty" id="empty" hidden>Tidak ada referensi yang cocok. Coba hapus filter atau kata pencariannya.</p>
    </main>
  </div>
</div>

<dialog id="box" aria-label="Referensi">
  <div class="viewer">
    <div class="stage" id="stage"></div>
    <div class="info" id="info"></div>
  </div>
</dialog>

<script>
const LIB = /*LIBRARY*/null;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const TYPES = [["all", "Semua"], ["image", "Gambar"], ["video", "Video"], ["link", "Link"]];
const TAG_ORDER = ["Gaya", "Motion", "Mindmap", "Grafik", "Tipografi", "Ikon", "Isometrik", "Perjalanan"];
const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1.2v7.6L8.6 5z"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const fmtDur = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const source = (url) => !url ? null : /pinterest/.test(url) ? "Pinterest" : /youtu/.test(url) ? "YouTube" : new URL(url).hostname;

const items = [];
LIB.collections.forEach((c) => c.items.forEach((it) => items.push(Object.assign(it, { col: c }))));
const state = { type: "all", tag: null, q: "" };

/* header counts */
const n = (t) => items.filter((i) => i.type === t).length;
document.getElementById("counts").innerHTML =
  `<span><b>${LIB.collections.length}</b> koleksi</span><span><b>${n("image")}</b> gambar</span><span><b>${n("video")}</b> video</span><span><b>${n("link")}</b> link</span>`;

/* rail */
document.getElementById("rail").innerHTML = LIB.collections.map((c) =>
  `<li><a href="#${c.id}" data-col="${c.id}"><time>${fmtDate(c.date)}</time><span>${esc(c.title.split(" · ")[0])}</span></a></li>`).join("");

/* filters */
const typesEl = document.getElementById("types");
typesEl.innerHTML = TYPES.map(([k, label]) =>
  `<button type="button" data-type="${k}" aria-pressed="${k === "all"}">${label}<small>${k === "all" ? items.length : n(k)}</small></button>`).join("");
const tagsPresent = TAG_ORDER.filter((t) => items.some((i) => (i.tags || []).includes(t)));
const tagsEl = document.getElementById("tags");
tagsEl.innerHTML = tagsPresent.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join("");

/* collections */
const list = (cls, title, arr) => arr && arr.length ? `<div><h3>${title}</h3><ul class="${cls}">${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
document.getElementById("sections").innerHTML = LIB.collections.map((c) => `
  <section class="col" id="${c.id}" aria-labelledby="h-${c.id}">
    <div class="col-head">
      <div class="meta"><time datetime="${c.date}">${fmtDate(c.date)}</time><span class="pill s-${c.status}">${esc(c.statusLabel)}</span>${c.folder ? `<span class="folder">${esc(c.folder)}</span>` : ""}</div>
      <h2 id="h-${c.id}">${esc(c.title)}</h2>
      ${c.quote ? `<blockquote class="quote"><span class="who">Pesanmu</span>“${esc(c.quote)}”</blockquote>` : ""}
      ${c.keywords ? `<div class="kw">${c.keywords.map((k) => `<span>${esc(k)}</span>`).join("")}</div>` : ""}
      ${c.quote2 ? `<blockquote class="quote"><span class="who">Tambahanmu</span>“${esc(c.quote2)}”</blockquote>` : ""}
      <div class="notes">${list("t", "Yang diambil", c.taken)}${list("x", "Yang dibuang", c.dropped)}${list("q", "Masih terbuka", c.open)}${list("u", "Dipakai di", c.usedIn)}</div>
    </div>
    <div class="grid">${c.items.map((it) => card(it)).join("")}</div>
  </section>`).join("");

function card(it) {
  const i = items.indexOf(it);
  const src = source(it.url);
  let thumb;
  if (it.thumbUrl) {
    const badge = it.type === "video" ? `<span class="badge">${PLAY}${fmtDur(it.dur)}</span>` : it.type === "link" ? `<span class="badge">${PLAY}${esc(src)}</span>` : "";
    thumb = `<button type="button" class="thumb" data-open="${i}" aria-label="Lihat ${esc(it.title)}"><img src="${it.thumbUrl}" alt="" loading="lazy" decoding="async">${badge}</button>`;
  } else {
    thumb = `<a class="thumb ph" href="${esc(it.url)}" target="_blank" rel="noopener" aria-label="Buka ${esc(it.title)} di ${esc(src)}"><div>${PLAY}<span>Buka di ${esc(src)} ↗</span></div></a>`;
  }
  const dims = it.w ? `${it.w}×${it.h}` : "";
  return `<article class="card" data-i="${i}">
    ${thumb}
    <div class="body">
      <h4>${esc(it.title)}</h4>
      <p>${esc(it.note)}</p>
      <div class="tagline">${(it.tags || []).map((t) => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="foot">${src ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(src)} ↗</a>` : `<span>File lokal</span>`}<span>${dims}</span></div>
    </div>
  </article>`;
}

/* filtering */
const cards = [...document.querySelectorAll(".card")];
function apply() {
  const q = state.q.trim().toLowerCase();
  cards.forEach((el) => {
    const it = items[+el.dataset.i];
    const hay = `${it.title} ${it.note} ${it.col.title} ${(it.tags || []).join(" ")}`.toLowerCase();
    el.hidden = !((state.type === "all" || it.type === state.type) && (!state.tag || (it.tags || []).includes(state.tag)) && (!q || hay.includes(q)));
  });
  let any = false;
  document.querySelectorAll(".col").forEach((s) => {
    const show = [...s.querySelectorAll(".card")].some((c) => !c.hidden);
    s.hidden = !show; any = any || show;
    const a = document.querySelector(`.rail a[data-col="${s.id}"]`);
    if (a) a.classList.toggle("dim", !show);
  });
  document.getElementById("empty").hidden = any;
}
typesEl.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.type = b.dataset.type;
  typesEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  apply();
});
tagsEl.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.tag = state.tag === b.dataset.tag ? null : b.dataset.tag;
  tagsEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.tag === state.tag)));
  apply();
});
document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; apply(); });

/* hover preview: a video card plays muted while the pointer is on it */
const fine = matchMedia("(hover: hover) and (pointer: fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
if (fine) document.querySelectorAll(".card").forEach((el) => {
  const it = items[+el.dataset.i];
  if (it.type !== "video") return;
  const t = el.querySelector(".thumb");
  t.addEventListener("pointerenter", () => {
    if (t.querySelector("video")) return;
    const v = Object.assign(document.createElement("video"), { src: it.media, muted: true, loop: true, playsInline: true, autoplay: true });
    v.setAttribute("aria-hidden", "true");
    t.insertBefore(v, t.querySelector(".badge"));
  });
  t.addEventListener("pointerleave", () => t.querySelector("video")?.remove());
});

/* viewer */
const box = document.getElementById("box"), stage = document.getElementById("stage"), info = document.getElementById("info");
let order = [], at = 0;
function show(k) {
  at = (k + order.length) % order.length;
  const it = items[order[at]];
  stage.innerHTML = it.type === "video"
    ? `<video src="${it.media}" controls autoplay muted loop playsinline></video>`
    : `<img src="${it.media}" alt="${esc(it.title)}">`;
  const src = source(it.url);
  const rows = [
    it.w ? ["Ukuran", `${it.w}×${it.h}`] : null,
    it.dur ? ["Durasi", `${fmtDur(it.dur)} · tanpa suara`] : null,
    it.tags?.length ? ["Topik", it.tags.join(", ")] : null,
    it.path ? ["File", `<code>${esc(it.path)}</code>`] : null,
  ].filter(Boolean);
  info.innerHTML = `
    <div class="from">${fmtDate(it.col.date)} · ${esc(it.col.title.split(" · ")[0])}</div>
    <h3>${esc(it.title)}</h3>
    <p>${esc(it.note)}</p>
    ${rows.length ? `<dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${a === "File" ? b : esc(b)}</dd>`).join("")}</dl>` : ""}
    ${src ? `<a class="go" href="${esc(it.url)}" target="_blank" rel="noopener">Buka di ${esc(src)} ↗</a>` : ""}
    <div class="vbar"><button type="button" data-step="-1" aria-label="Sebelumnya">←</button><button type="button" data-step="1" aria-label="Berikutnya">→</button><small>${at + 1} / ${order.length}</small><button type="button" class="close">Tutup</button></div>`;
}
document.getElementById("sections").addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]"); if (!b) return;
  order = cards.filter((c) => !c.hidden && items[+c.dataset.i].media).map((c) => +c.dataset.i);
  show(order.indexOf(+b.dataset.open));
  box.showModal();
});
info.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("close")) box.close(); else show(at + Number(b.dataset.step));
});
box.addEventListener("click", (e) => { if (e.target === box) box.close(); });
box.addEventListener("close", () => { stage.innerHTML = ""; });
box.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show(at + 1);
  if (e.key === "ArrowLeft") show(at - 1);
});

/* rail follows the scroll */
const railLinks = [...document.querySelectorAll(".rail a")];
const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => { if (en.isIntersecting) railLinks.forEach((a) => a.classList.toggle("on", a.dataset.col === en.target.id)); });
}, { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll(".col").forEach((s) => io.observe(s));
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
